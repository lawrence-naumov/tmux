# tmux >= 3.2 (copy-command, terminal-features). macOS и Linux.

# tmux-256color есть не везде (старые Debian/CentOS без ncurses-term) — тогда screen-256color
set -g default-terminal "screen-256color"
if 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "tmux-256color"'

# truecolor для внешних терминалов с 24-bit цветом (Apple Terminal на macOS 26,
# iTerm2, Ghostty, Alacritty, kitty, WezTerm, GNOME Terminal, Konsole)
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB,alacritty:RGB,xterm-kitty:RGB,wezterm:RGB"

# ── копирование ──────────────────────────────────────────────────────────────
# Выделение мышью, y и Enter в copy-mode кладут текст в системный буфер.
# Утилита выбирается при загрузке конфига; строки ниже по приоритету
# возрастают — последняя найденная побеждает.
set -g mouse on
setw -g mode-keys vi
if 'command -v xsel >/dev/null' 'set -s copy-command "xsel -ib"'
if 'command -v xclip >/dev/null' 'set -s copy-command "xclip -selection clipboard"'
if '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null' 'set -s copy-command "wl-copy"'
if 'command -v pbcopy >/dev/null' 'set -s copy-command "pbcopy"'
# OSC 52: буфер внешнего терминала, в т.ч. по SSH на сервер без X/Wayland
set -s set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# ── gruvbox dark ─────────────────────────────────────────────────────────────
# bg0 #282828  bg1 #3c3836  bg2 #504945  fg #ebdbb2  fg4 #a89984
# yellow #fabd2f  orange #fe8019  aqua #8ec07c  gray #928374  red #fb4934

set -g status-style "bg=#3c3836,fg=#a89984"
set -g status-left-length 30
set -g status-left "#[bg=#a89984,fg=#282828,bold] #S #[default] "
set -g status-right "#[bg=#504945,fg=#ebdbb2] %Y-%m-%d %H:%M #[bg=#a89984,fg=#282828,bold] #h "

set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=#fabd2f,fg=#282828,bold] #I #W "
set -g window-status-separator ""

set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"
set -g display-panes-colour "#a89984"
set -g display-panes-active-colour "#fabd2f"

set -g message-style "bg=#504945,fg=#ebdbb2"
set -g message-command-style "bg=#504945,fg=#ebdbb2"
set -g mode-style "bg=#fabd2f,fg=#282828"
set -g clock-mode-colour "#fabd2f"

# ── кириллическая раскладка ──────────────────────────────────────────────────
# prefix + с/т/з/... = prefix + c/n/p/..., в copy-mode о/л/м/н = j/k/v/y.
# Должно оставаться последней строкой: копирует уже заданные бинды.
run-shell '"$(dirname "$(readlink -f ~/.tmux.conf)")/cyrillic-keys.sh"'
